name: merge-bestcf
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 merge.py
      - run: |
          for f in tw.txt hk.txt sg.txt jp.txt nl.txt us.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git config user.name "bestcf-merge-bot"
            git config user.email "bestcf-merge-bot@users.noreply.github.com"
            git commit -m "chore: merge bestcf $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
